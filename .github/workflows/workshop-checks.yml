name: Workshop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -B checks/release_check.py
      - run: python -B code/checks/focused_checks.py
      - run: python -B checks/startup_checks.py
      - run: python -B checks/key_entry_checks.py
